<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Culture — recommandations culturelles</title>
  <meta name="description" content="Le carnet de recommandations culturelles de Jordan Beauvais.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%2316140F%27/%3E%3Ccircle cx=%2722%27 cy=%2722%27 r=%274%27 fill=%27%23D2432A%27/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">
    <header class="masthead">
      <div class="masthead__top">
        <span id="issue">N° — · Paris</span>
        <span class="masthead__owner">Carnet de Jordan Beauvais</span>
        <span id="today"></span>
      </div>
      <div class="masthead__main">
        <h1 class="logo">Culture<span class="logo__dot">.</span></h1>
        <p class="tagline">Films, livres, disques, lieux&nbsp;: tout ce qu’on m’a conseillé, <em>et que je ne veux pas oublier.</em></p>
      </div>
      <dl class="stats" id="stats"></dl>
    </header>

    <nav class="toolbar" aria-label="Filtres">
      <div class="cats" id="cats" role="tablist"></div>
      <div class="toolbar__row">
        <div class="seg" id="statuses" role="group" aria-label="Statut"></div>
        <div class="toolbar__right">
          <label class="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="q" type="search" placeholder="Titre, auteur, ami, tag…" autocomplete="off">
          </label>
          <label class="sort">
            <span>Trier</span>
            <select id="sort">
              <option value="recent">Plus récents</option>
              <option value="alpha">A → Z</option>
            </select>
          </label>
        </div>
      </div>
    </nav>

    <main>
      <p class="result-line" id="resultLine"></p>
      <section class="grid" id="grid" aria-live="polite"></section>
      <section class="empty" id="empty" hidden></section>
    </main>

    <footer class="colophon">
      <span>Culture — composé en Instrument Serif &amp; Inter Tight.</span>
      <span>Images&nbsp;: Wikipédia / Wikimedia Commons.</span>
    </footer>
  </div>

  <div class="drawer" id="drawer" hidden>
    <div class="drawer__backdrop" data-close></div>
    <article class="drawer__panel" role="dialog" aria-modal="true" aria-labelledby="dTitle" tabindex="-1">
      <button class="drawer__close" data-close aria-label="Fermer">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <div id="drawerBody"></div>
    </article>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
